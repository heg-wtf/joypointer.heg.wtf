<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">JoyPointer</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f4a"/>
      <stop offset="1" stop-color="#14162a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#body)"/>
  <!-- controller silhouette -->
  <path d="M34 46h60a18 18 0 0 1 17.6 14.3l6.2 30.2A11 11 0 0 1 107 104h-1.6a11 11 0 0 1-8.9-4.5L86 84H42L31.5 99.5A11 11 0 0 1 22.6 104H21a11 11 0 0 1-10.8-13.5l6.2-30.2A18 18 0 0 1 34 46Z" fill="#f7f4ec"/>
  <!-- d-pad -->
  <path d="M40 58h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#2b2f4a"/>
  <!-- left stick -->
  <circle cx="64" cy="76" r="7" fill="#2b2f4a"/>
  <!-- face buttons -->
  <circle cx="86" cy="60" r="4.2" fill="#ff9f43"/>
  <circle cx="94" cy="68" r="4.2" fill="#2b2f4a"/>
  <circle cx="78" cy="68" r="4.2" fill="#2b2f4a"/>
  <circle cx="86" cy="76" r="4.2" fill="#2b2f4a"/>
  <!-- pointer arrow escaping the pad -->
  <path d="M76 18l26 12-10.5 3.6L98 46l-6.6 2.4-6.4-12.2L76 44z" fill="#ff9f43" stroke="#14162a" stroke-width="3" stroke-linejoin="round"/>
</svg>
